name: ci

on:
  push:
    branches:
      [main, "001-remote-skill-delivery", "002-github-catalog-ingestion"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.21.0
  SKILLWIRE_GITHUB_INGESTION_ENABLED: "false"
  SKILLWIRE_BLOCK_GITHUB_NETWORK: "true"

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Enable the locked package manager
        run:
          corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Type-aware ESLint
        run: pnpm lint
      - name: Strict typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Benchmark input schemas
        run: pnpm benchmark:validate
      - name: Diff checks
        run: git diff --check && git diff --exit-code

  unit-evaluation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run:
          corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm test:evaluation

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run:
          corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: skillwire_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skillwire-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillwire_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:skillwire-ci-only@127.0.0.1:5432/skillwire_ci
      TEST_DATABASE_URL: postgresql://postgres:skillwire-ci-only@127.0.0.1:5432/skillwire_ci
      SKILLWIRE_API_KEY_PEPPER: ci-only-pepper-with-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run:
          corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - name: Migrations
        run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm test:security

  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run:
          corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - name: Read-only catalog verification
        run: pnpm catalog:verify --release-id launch-catalog-v1
      - name: Release-anchored advisory verification
        run: pnpm advisory:verify --release-id launch-catalog-v1
      - run: git diff --check && git diff --exit-code

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run:
          corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - name: Create ephemeral Compose secrets
        run: |
          umask 077
          mkdir -p .secrets
          openssl rand -hex 32 > .secrets/postgres-password
          openssl rand -hex 32 > .secrets/api-key-pepper
          node -e "const fs=require('fs'); const p=fs.readFileSync('.secrets/postgres-password','utf8').trim(); fs.writeFileSync('.secrets/database-url', 'postgresql://skillwire:'+p+'@postgres:5432/skillwire\n', {mode:0o600})"
          chmod 0444 .secrets/database-url .secrets/api-key-pepper
      - name: Validate Compose and build production image
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.test.yaml config --quiet
          docker build --target runtime --tag skillwire:local .
      - name: Verify production image boundary
        run: |
          test "$(docker run --rm --entrypoint node skillwire:local -p 'process.getuid()')" = "10001"
          docker run --rm --entrypoint node skillwire:local -e "for (const p of ['typescript','tsx','vitest']) { try { require.resolve(p); process.exit(1) } catch {} }"
          if docker run --rm skillwire:local; then
            echo "service unexpectedly accepted missing required configuration" >&2
            exit 1
          fi
      - name: Start, migrate, and verify health
        run: |
          docker compose up --detach --wait --no-build
          curl --fail --silent http://127.0.0.1:3000/health/live
          curl --fail --silent http://127.0.0.1:3000/health/ready
      - name: Bootstrap one account and key
        run: |
          account_json=$(docker compose exec -T skillwire node dist/src/authentication/admin-cli.js account:create)
          account_id=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).accountId)" "$account_json")
          key_json=$(docker compose exec -T skillwire node dist/src/authentication/admin-cli.js key:create --account-id "$account_id")
          node -e "const fs=require('fs'); fs.writeFileSync('.secrets/api-key', JSON.parse(process.argv[1]).token+'\n', {mode:0o600})" "$key_json"
      - name: Run progressive and repository-memory smoke journey
        run: |
          repository_hash=$(printf 'skillwire-ci-smoke' | sha256sum | cut -d' ' -f1)
          pnpm smoke:mcp --endpoint http://127.0.0.1:3000/mcp --api-key-file .secrets/api-key --task 'Review TypeScript type safety' --repository-hash "$repository_hash" --verify-memory
      - name: Run fast functional benchmark smoke without a timing gate
        run: |
          chmod 0444 .secrets/api-key
          trap 'chmod 0600 .secrets/api-key' EXIT
          docker build --target test --tag skillwire-benchmark:local .
          SKILLWIRE_BENCHMARK_COMMIT="$GITHUB_SHA"
          SKILLWIRE_BENCHMARK_DOCKER_VERSION="$(docker version --format '{{.Server.Version}}')"
          SKILLWIRE_BENCHMARK_COMPOSE_VERSION="$(docker compose version --short)"
          SKILLWIRE_BENCHMARK_SKILLWIRE_IMAGE_DIGEST="$(docker image inspect skillwire:local --format '{{.Id}}')"
          postgres_container=$(docker compose ps -q postgres)
          SKILLWIRE_BENCHMARK_POSTGRES_IMAGE_DIGEST="$(docker inspect "$postgres_container" --format '{{.Image}}')"
          SKILLWIRE_BENCHMARK_CLIENT_IMAGE_DIGEST="$(docker image inspect skillwire-benchmark:local --format '{{.Id}}')"
          SKILLWIRE_BENCHMARK_UID="$(id -u)"
          SKILLWIRE_BENCHMARK_GID="$(id -g)"
          export SKILLWIRE_BENCHMARK_COMMIT SKILLWIRE_BENCHMARK_DOCKER_VERSION SKILLWIRE_BENCHMARK_COMPOSE_VERSION
          export SKILLWIRE_BENCHMARK_SKILLWIRE_IMAGE_DIGEST SKILLWIRE_BENCHMARK_POSTGRES_IMAGE_DIGEST SKILLWIRE_BENCHMARK_CLIENT_IMAGE_DIGEST
          export SKILLWIRE_BENCHMARK_UID SKILLWIRE_BENCHMARK_GID
          docker compose -f compose.yaml -f compose.benchmark.yaml --profile benchmark up --detach --wait --no-build skillwire
          SKILLWIRE_BENCHMARK_CONCURRENCY=2 \
          SKILLWIRE_BENCHMARK_WARMUP=0 \
          SKILLWIRE_BENCHMARK_SAMPLES=100 \
          SKILLWIRE_BENCHMARK_REQUIRE_SUCCESS=true \
            docker compose -f compose.yaml -f compose.benchmark.yaml --profile benchmark run --rm benchmark
      - name: Run the suite inside the test container
        run:
          docker compose -f compose.yaml -f compose.test.yaml run --rm --build
          test
      - name: Verify graceful stop and container restart
        run: |
          docker compose stop --timeout 15 skillwire
          container_id=$(docker compose ps -a -q skillwire)
          test -n "$container_id"
          test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" = "0"
          docker compose up --detach --wait --no-build skillwire
          docker compose restart --timeout 15 skillwire
          docker compose up --detach --wait --no-build skillwire
          curl --fail --silent http://127.0.0.1:3000/health/ready
      - name: Clean up
        if: always()
        run:
          docker compose -f compose.yaml -f compose.test.yaml down --volumes
          --remove-orphans
