name: github-live-smoke

on:
  workflow_dispatch:
    inputs:
      run_live_github:
        description:
          Confirm use of the live GitHub API against the fixed acceptance commit
        required: true
        type: boolean

permissions:
  contents: read

env:
  PNPM_VERSION: 11.21.0

jobs:
  pinned-public-source:
    if: inputs.run_live_github
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: skillwire_live_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skillwire-live-smoke-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillwire_live_smoke"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:skillwire-live-smoke-only@127.0.0.1:5432/skillwire_live_smoke
      TEST_DATABASE_URL: postgresql://postgres:skillwire-live-smoke-only@127.0.0.1:5432/skillwire_live_smoke
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run:
          corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - name: Import the exact pinned source into disposable PostgreSQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm smoke:github-live
